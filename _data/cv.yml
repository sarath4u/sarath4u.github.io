  summary: Researcher with expertise in computational fluid dynamics, turbulence-resolving simulations, non- linear flow physics, and scientific computing. Experienced in high-fidelity numerical methods, surrogate modeling, and machine learning approaches for engineering applications, including the development of surrogate and reduced-order models of complex systems. Background includes aerospace propulsion systems, large-scale CFD workflows, and multi-physics computational research. Interested in non-linear mechanics, fluid–structure interactions, scientific machine learning, and physics-informed modeling of complex dynamical systems.


