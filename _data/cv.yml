        summary:
        highlights:
          - Contributed to the development of reduced-order and surrogate-modelling approaches for CFD applications.
          - Collaborated with interdisciplinary and international research teams across CFD and scientific- computing projects.
          - Supported graduate students in numerical modelling, data analysis, and scientific problem-solving.

      - company: Barcelona Supercomputing Center
        position: First Stage Researcher
        location: Barcelona, Spain
        start_date: 2018
        end_date: 2024
        highlights:
          - Research focus{:} data-driven non-equilibrium wall modelling for Large-Eddy Simulation (LES) of turbulent wall-bounded flows.
          - Combined turbulence modelling, numerical simulation, and machine-learning methods
          - Conducted high-fidelity wall-modeled large eddy simulations of complex three-dimensional flows involving strong anisotropy, separation, and non-linear turbulent interactions such as NASA Junction flow, NASA Hump, Neutral Atmospheric Boundary Layer flow over urban areas, etc.
          - Developed machine-learning-assisted wall models for LES to represent unresolved near-wall turbulence in wall-bounded turbulent flows
          - Analysed large numerical datasets using Python-based scientific computing and data-analysis workflows
          - Performed HPC-based CFD workflows using parallel computing environments and large-scale simulation datasets
          - Developed reproducible numerical-analysis and post-processing workflows for simulation data interpretation
          - Contributed to technical publications, conference papers, and presentations in CFD and HPC-related research areas.

      - company: Indian Space Research Organization (ISRO)
        position: System Engineer
        location: Thiruvananthapuram, India
        start_date: 2008
        end_date: 2015
        highlights:
          - Worked on aerospace-related engineering projects within the Air Breathing Propulsion Project in a mission-oriented environment
          - Contributed to engineering-analysis activities involving fluid mechanics, thermal-fluid systems, heat transfer, and structural mechanics
          - Supported engineering activities related to propulsion-system-oriented thermo-fluid problems and associated engineering workflows
          - Worked in interdisciplinary engineering teams operating under strict quality, reliability, and documentation standards
          - Participated in technical problem-solving and engineering-analysis tasks for aerospace applications
          - Mentored graduate engineering trainees in engineering fundamentals and analytical problem- solving

