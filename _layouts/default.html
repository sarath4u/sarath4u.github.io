<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title == "Home" %}
      {{ site.title }}
    {% else %}
      {{ page.title }} | {{ site.author.name }}
    {% endif %}
  </title>

  <meta name="description" content="{{ site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="{{ '/' | relative_url }}">SARATH R.</a>

      <nav aria-label="Main navigation">
        <a href="{{ '/research/' | relative_url }}">Research</a>
        <a href="{{ '/lectures/' | relative_url }}">Lectures</a>
        <a href="{{ '/code/' | relative_url }}">Code lab</a>
        <a href="{{ '/#about' | relative_url }}">About</a>
      </nav>
    </div>
  </header>

  <main class="container content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        © {{ site.time | date: "%Y" }} {{ site.author.name }}
        · Built with Jekyll and GitHub Pages
      </p>
      <a href="https://github.com/sarath4u">GitHub</a>
    </div>
  </footer>
</body>
</html>
